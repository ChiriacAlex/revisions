- id: td2ev-ex1
  type: numeric
  prompt: "Exercice 1 : $X$ de densité $\\frac{3}{x^4}$ sur $[1, +\\infty[$. Que vaut $V(X)$ ? (décimal)"
  answer: 0.75
  tolerance: 0.0001
  explanation: "$E[X] = \\frac{3}{2}$, $E[X^2] = 3$, donc $V(X) = 3 - \\frac{9}{4} = \\frac{3}{4}$."
  verify: {check: python_expr, expr: "3 - (3 / 2) ** 2"}
- id: td2ev-ex2-ex3
  type: truefalse
  prompt: Vrai ou faux ?
  statements:
    - text: "Si $Z \\sim \\mathcal{U}(0, 1)$, $V(Z) = \\frac{1}{12}$."
      answer: true
      why: "$\\frac{1}{3} - \\frac{1}{4}$."
      verify: {check: python_expr, expr: "abs(counting.integrate(lambda x: x * x, 0, 1) - 0.25 - 1 / 12) < 1e-12"}
    - text: "Si $X \\sim \\mathcal{U}([2, 8])$, $V(X) = 3$."
      answer: true
      why: "$\\frac{(8 - 2)^2}{12} = \\frac{36}{12} = 3$."
      verify: {check: python_expr, expr: "abs(counting.integrate(lambda x: x * x / 6, 2, 8) - 25 - 3) < 1e-9"}
    - text: "Si $X \\sim \\mathcal{E}(\\lambda)$, l'écart-type de $X$ vaut $\\frac{1}{\\lambda^2}$."
      answer: false
      why: "C'est la **variance** qui vaut $\\frac{1}{\\lambda^2}$ ; l'écart-type vaut $\\frac{1}{\\lambda}$."
    - text: "Si $X \\sim \\mathcal{E}(2)$, alors $2X \\sim \\mathcal{E}(1)$."
      answer: true
      why: "$\\alpha = \\lambda$ : $P(2X \\le t) = 1 - e^{-2 \\cdot t/2} = 1 - e^{-t}$."
- id: td2ev-ex4-ex5
  type: numeric
  prompt: "Exercice 5 : des $X_i$ indépendantes ont pour variance $\\sigma^2 = 4$. Avec $n = 100$ et $\\varepsilon = 0{,}5$, quelle borne Tchebychev donne-t-il pour $P(|\\overline{X}_n - m| \\ge \\varepsilon)$ ? (décimal)"
  answer: 0.16
  tolerance: 0.0001
  explanation: "$\\frac{\\sigma^2}{n\\varepsilon^2} = \\frac{4}{100 \\times 0{,}25} = 0{,}16$."
  verify: {check: python_expr, expr: "4 / (100 * 0.5 ** 2)"}
