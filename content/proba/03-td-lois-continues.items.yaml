- id: tdc-k
  type: numeric
  prompt: "Exercice 1.3 : pour $f(x) = k\\,x(2 - x)$ sur $[0, 2]$, quelle valeur de $k$ ? (décimal)"
  answer: 0.75
  tolerance: 0.0001
  explanation: "$\\int_0^2 x(2 - x)\\,dx = \\frac{4}{3}$, donc $k = \\frac{3}{4}$."
  verify: {check: python_expr, expr: "round(1 / counting.integrate(lambda x: x * (2 - x), 0, 2), 6)"}
- id: tdc-expo
  type: numeric
  prompt: "Exercice 4 : $T \\sim \\mathcal{E}(1/4)$. Que vaut $P(T > 8 \\mid T > 6)$ ? (3 décimales)"
  answer: 0.607
  tolerance: 0.001
  explanation: "Absence de mémoire : $P(T > 2) = e^{-2/4} = e^{-0{,}5} \\approx 0{,}607$."
  verify: {check: python_expr, expr: "round(__import__('math').exp(-8 / 4) / __import__('math').exp(-6 / 4), 3)"}
- id: tdc-normale
  type: numeric
  prompt: "Exercice 5.3 : temps de réponse $\\mathcal{N}(120, 15^2)$. Proportion de requêtes au-dessus de 150 ms ? (4 décimales)"
  answer: 0.0228
  tolerance: 0.0001
  explanation: "$1 - \\Phi(2) \\approx 0{,}0228$."
  verify: {check: python_expr, expr: "round(1 - counting.Phi((150 - 120) / 15), 4)"}
- id: tdc-changement
  type: qcm
  prompt: "Extra 3 : $X \\sim \\mathcal{U}([-2, 1])$. Que vaut $P(|X| \\le 1{,}5)$ ?"
  options:
    - text: "$\\frac{5}{6}$"
      correct: true
      why: "$t = 1{,}5 \\in [1, 2]$ : $F(t) = \\frac{1 + t}{3} = \\frac{2{,}5}{3} = \\frac{5}{6}$."
      verify: {check: python_expr, expr: "abs(counting.integrate(lambda x: 1 / 3, -1.5, 1) - 5 / 6) < 1e-9"}
    - text: "$1$"
      why: "$X$ peut valoir $-1{,}8$, et alors $|X| = 1{,}8 > 1{,}5$."
    - text: "$\\frac{2 \\times 1{,}5}{3} = 1$"
      why: "La formule $\\frac{2t}{3}$ ne vaut que pour $t \\le 1$ : au-delà, $[-t, t]$ déborde de $[-2, 1]$ à droite."
    - text: "$\\frac{1{,}5}{3} = \\frac{1}{2}$"
      why: "On a oublié la partie négative $[-1{,}5, 0]$."
