- id: ch12-analyse
  type: qcm
  prompt: "Un étudiant résout $x = \\sqrt{2 - x}$ ainsi : « $x^2 = 2 - x$, donc $x \\in \\{1, -2\\}$. » Qu'en penser ?"
  options:
    - text: C'est juste et complet.
      why: "$-2$ n'est pas solution : $\\sqrt{2 - (-2)} = 2 \\neq -2$."
      verify: {check: python_expr, expr: "abs((2 - (-2)) ** 0.5 - (-2)) < 1e-12"}
    - text: "C'est seulement l'**analyse** : il manque la synthèse, qui élimine $-2$."
      correct: true
      why: "Élever au carré ne donne que des conditions nécessaires. La synthèse montre que $S = \\{1\\}$."
      verify: {check: python_expr, expr: "[x for x in (1, -2) if abs((2 - x) ** 0.5 - x) < 1e-12] == [1]"}
    - text: "Il fallait d'abord diviser par $x$."
      why: "Diviser par $x$ suppose $x \\neq 0$ et n'aide en rien ici."
    - text: "L'équation n'a pas de solution réelle."
      why: "$x = 1$ convient : $\\sqrt{1} = 1$."
- id: ch12-parties-contenant
  type: numeric
  prompt: "Combien de parties de $\\{1, 2, \\ldots, 10\\}$ contiennent $\\{1, 2, 3\\}$ ?"
  answer: 128
  explanation: "Elles sont en bijection avec les parties de $\\{4, \\ldots, 10\\}$ (7 éléments) via $X \\mapsto X \\setminus \\{1, 2, 3\\}$ : $2^{10 - 3} = 2^7 = 128$."
  verify: {check: python_expr, expr: "sum(1 for X in counting.powerset(range(1, 11)) if {1, 2, 3} <= X)"}
