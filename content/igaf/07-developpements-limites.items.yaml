- id: dl-calculs
  type: truefalse
  prompt: "Développements limités en $0$. Vrai ou faux ?"
  statements:
    - text: "Le coefficient de $x^3$ dans le DL de $(1 + x^3)\\sqrt{1 - x}$ vaut $\\frac{5}{16}$ (valeur du poly)."
      answer: false
      why: "$x^3 \\cdot 1 - \\frac{x^3}{16} = \\frac{15}{16}x^3$."
      verify: {check: python_expr, expr: "abs(calc.series_coeff('(1+x**3)*sqrt(1-x)', 3) - 5/16) < 1e-12"}
    - text: "$\\tan x = x + \\frac{x^3}{3} + \\frac{2x^5}{15} + o(x^5)$"
      answer: true
      why: "Division selon les puissances croissantes de $\\sin x$ par $\\cos x$."
      verify: {check: python_expr, expr: "calc.series_coeff('tan(x)', 3) == 1/3 and calc.series_coeff('tan(x)', 5) == 2/15"}
    - text: "$\\arctan x = x - \\frac{x^3}{3} + \\frac{x^5}{5} + o(x^6)$"
      answer: true
      why: "Primitive de $1 - x^2 + x^4 + o(x^5)$, avec $\\arctan 0 = 0$."
      verify: {check: python_expr, expr: "calc.series_coeff('atan(x)', 3) == -1/3 and calc.series_coeff('atan(x)', 5) == 1/5 and calc.series_coeff('atan(x)', 4) == 0"}
    - text: "$\\frac{\\ln(1 + x)}{\\sin x} = 1 - \\frac{x}{2} + \\frac{x^2}{2} - \\frac{x^3}{4} + o(x^3)$ (résultat du poly)"
      answer: false
      why: "Le coefficient de $x^3$ est $-\\frac{1}{4} - \\frac{1}{12} = -\\frac{1}{3}$."
      verify: {check: python_expr, expr: "calc.series_coeff('log(1+x)/sin(x)', 3) == -1/4"}
    - text: "$e^{\\cos x} = e - \\frac{e}{2}x^2 + o(x^3)$"
      answer: true
      why: "$e^{\\cos x} = e \\cdot e^{-x^2/2 + o(x^3)} = e\\left(1 - \\frac{x^2}{2}\\right) + o(x^3)$."
      verify: {check: python_expr, expr: "abs(calc.series_coeff('exp(cos(x))', 2) + calc.value('E')/2) < 1e-12 and calc.series_coeff('exp(cos(x))', 3) == 0"}
- id: dl-limites
  type: numeric
  prompt: "Calculer $\\lim_{x \\to 0} \\frac{e^x - 1 - x}{1 - \\cos x}$."
  answer: 1
  tolerance: 0.0001
  explanation: "$e^x - 1 - x \\sim \\frac{x^2}{2}$ et $1 - \\cos x \\sim \\frac{x^2}{2}$ : le quotient tend vers $1$."
  verify: {check: python_expr, expr: "calc.limit('(exp(x)-1-x)/(1-cos(x))', 0)"}
