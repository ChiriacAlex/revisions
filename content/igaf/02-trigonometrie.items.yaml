- id: trigo-formules
  type: truefalse
  prompt: "Formules (pour tous les réels où elles ont un sens). Vrai ou faux ?"
  statements:
    - text: "$\\sin^2 x = \\frac{1 - \\cos 2x}{2}$"
      answer: true
      why: "C'est $\\cos 2x = 1 - 2\\sin^2 x$ réarrangée."
      verify: {check: python_expr, expr: "calc.identity('sin(x)**2', '(1-cos(2*x))/2')"}
    - text: "$\\cos 5x \\sin 3x = \\frac{1}{2}\\left(\\sin 8x - \\sin 2x\\right)$"
      answer: true
      why: "$\\sin a \\cos b = \\frac{1}{2}[\\sin(a + b) + \\sin(a - b)]$ avec $a = 3x$, $b = 5x$ : $\\sin 8x + \\sin(-2x)$."
      verify: {check: python_expr, expr: "calc.identity('cos(5*x)*sin(3*x)', '(sin(8*x)-sin(2*x))/2')"}
    - text: "$\\cot a - \\cot b = \\frac{\\sin(a - b)}{\\sin a \\sin b}$ (formule 40 de la fiche)"
      answer: false
      why: "Le bon numérateur est $\\sin(b - a)$ : la fiche se trompe de signe."
      verify: {check: python_expr, expr: "calc.identity('cot(x)-cot(2*x+1)', 'sin(x-(2*x+1))/(sin(x)*sin(2*x+1))')"}
    - text: "$\\int \\cot x\\,dx = \\ln|\\sin x| + C$"
      answer: true
      why: "$\\cot = \\frac{\\cos}{\\sin} = \\frac{u'}{u}$ avec $u = \\sin x$."
      verify: {check: python_expr, expr: "calc.antiderivative_ok('cot(x)', 'log(sin(x))', points=(0.3, 1.1, 2.5))"}
    - text: "$\\cos x - \\sin x = \\sqrt{2}\\sin\\left(\\frac{\\pi}{4} - x\\right)$"
      answer: true
      why: "$\\sqrt{2}\\left(\\frac{\\sqrt{2}}{2}\\cos x - \\frac{\\sqrt{2}}{2}\\sin x\\right)$."
      verify: {check: python_expr, expr: "calc.identity('cos(x)-sin(x)', 'sqrt(2)*sin(pi/4-x)')"}
    - text: "$\\tan(\\pi + x) = -\\tan x$"
      answer: false
      why: "$\\tan$ est $\\pi$-périodique : $\\tan(\\pi + x) = \\tan x$."
      verify: {check: python_expr, expr: "calc.identity('tan(pi+x)', '-tan(x)')"}
- id: trigo-valeurs
  type: qcm
  multi: true
  prompt: Quelles égalités sont justes ?
  options:
    - text: "$\\arcsin\\frac{1}{2} = \\frac{\\pi}{6}$"
      correct: true
      why: "$\\sin\\frac{\\pi}{6} = \\frac{1}{2}$ et $\\frac{\\pi}{6} \\in \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$."
      verify: {check: python_expr, expr: "abs(calc.value('asin(1/2)') - calc.value('pi/6')) < 1e-12"}
    - text: "$\\arccos\\left(-\\frac{1}{2}\\right) = \\frac{2\\pi}{3}$"
      correct: true
      why: "$\\arccos(-x) = \\pi - \\arccos x = \\pi - \\frac{\\pi}{3}$."
      verify: {check: python_expr, expr: "abs(calc.value('acos(-1/2)') - calc.value('2*pi/3')) < 1e-12"}
    - text: "$\\arctan\\sqrt{3} = \\frac{\\pi}{6}$"
      why: "$\\tan\\frac{\\pi}{3} = \\sqrt{3}$, donc $\\arctan\\sqrt{3} = \\frac{\\pi}{3}$."
      verify: {check: python_expr, expr: "abs(calc.value('atan(sqrt(3))') - calc.value('pi/6')) < 1e-12"}
    - text: "$\\sin(\\arccos x) = \\sqrt{1 - x^2}$ pour $x \\in [-1, 1]$"
      correct: true
      why: "$\\arccos x \\in [0, \\pi]$, où $\\sin \\ge 0$, et $\\sin^2 = 1 - \\cos^2 = 1 - x^2$."
      verify: {check: python_expr, expr: "calc.identity('sin(acos(x))', 'sqrt(1-x**2)', points=(-0.9, -0.2, 0.4, 0.8))"}
    - text: "$\\arcsin(\\sin 3) = 3$"
      why: "$3 \\notin \\left[-\\frac{\\pi}{2}, \\frac{\\pi}{2}\\right]$ : $\\arcsin(\\sin 3) = \\pi - 3$."
      verify: {check: python_expr, expr: "abs(calc.value('asin(sin(3))') - 3) < 1e-12"}
