- id: pre-limites
  type: truefalse
  prompt: Vrai ou faux ?
  statements:
    - text: "$\\lim_{x \\to +\\infty} \\left(\\sqrt{x^2 + x} - x\\right) = \\frac{1}{2}$"
      answer: true
      why: "Quantité conjuguée : $\\frac{x}{\\sqrt{x^2 + x} + x} = \\frac{1}{\\sqrt{1 + 1/x} + 1} \\to \\frac{1}{2}$."
      verify: {check: python_expr, expr: "abs(calc.limit('sqrt(x**2+x)-x', 'oo') - 0.5) < 1e-12"}
    - text: "$\\lim_{x \\to +\\infty} \\frac{3x^2 + 1}{5x^2 - x} = \\frac{3}{5}$"
      answer: true
      why: "On garde les termes de plus haut degré : $\\frac{3x^2}{5x^2}$."
      verify: {check: python_expr, expr: "abs(calc.limit('(3*x**2+1)/(5*x**2-x)', 'oo') - 0.6) < 1e-12"}
    - text: "$\\lim_{x \\to +\\infty} \\frac{e^x}{x^{100}} = 0$"
      answer: false
      why: "L'exponentielle l'emporte sur toute puissance : la limite vaut $+\\infty$."
      verify: {check: python_expr, expr: "calc.limit('exp(x)/x**100', 'oo') == 0"}
    - text: "$\\lim_{x \\to 0^+} x \\ln x = 0$"
      answer: true
      why: "Croissances comparées en $0^+$ : la puissance l'emporte sur le logarithme."
      verify: {check: python_expr, expr: "abs(calc.limit('x*log(x)', 0, '+')) < 1e-12"}
    - text: "$\\sin\\frac{1}{x}$ a une limite quand $x \\to 0$."
      answer: false
      why: "Elle oscille entre $-1$ et $1$ : en $u_n = \\frac{1}{\\pi/2 + 2n\\pi}$ elle vaut $1$, en $v_n = \\frac{1}{3\\pi/2 + 2n\\pi}$ elle vaut $-1$."
- id: pre-theoremes
  type: truefalse
  prompt: Continuité, dérivabilité et grands théorèmes. Vrai ou faux ?
  statements:
    - text: Une fonction dérivable en $a$ est continue en $a$.
      answer: true
      why: "$f(x) - f(a) = \\frac{f(x) - f(a)}{x - a}(x - a) \\to f'(a) \\times 0 = 0$."
    - text: Une fonction continue en $a$ est dérivable en $a$.
      answer: false
      why: "$|x|$ est continue en $0$ mais $f'(0^-) = -1 \\ne 1 = f'(0^+)$."
    - text: Le théorème de Rolle s'applique à $f(x) = |x|$ sur $[-1, 1]$.
      answer: false
      why: "$f(-1) = f(1)$, mais $f$ n'est pas dérivable en $0 \\in ]-1, 1[$. D'ailleurs $f'$ ne s'annule jamais."
    - text: "Pour $f(x) = x^3$ sur $[0, 3]$, le point $c$ des accroissements finis vaut $\\sqrt{3}$."
      answer: true
      why: "$f'(c) = 3c^2 = \\frac{27 - 0}{3} = 9$, donc $c^2 = 3$ et $c = \\sqrt{3} \\in ]0, 3[$."
      verify: {check: python_expr, expr: "abs(3 * (3 ** 0.5) ** 2 - (3 ** 3 - 0 ** 3) / 3) < 1e-12"}
    - text: "Si $f' = g'$ sur un intervalle, alors $f = g$."
      answer: false
      why: "Seulement $f = g + C$ (accroissements finis appliqués à $f - g$). Exemple : $x^2$ et $x^2 + 1$."
- id: pre-exp-ln
  type: numeric
  prompt: "Calculer $\\int_0^1 x \\ln x\\,dx$ (décimal)."
  answer: -0.25
  tolerance: 0.0001
  explanation: "Formule $\\int_0^1 x^\\alpha \\ln x\\,dx = -\\frac{1}{(\\alpha + 1)^2}$ avec $\\alpha = 1$. Ou par parties : $\\left[\\frac{x^2}{2}\\ln x\\right]_0^1 - \\int_0^1 \\frac{x}{2}\\,dx = 0 - \\frac{1}{4}$ (le terme de bord tend vers $0$ en $0^+$ par croissances comparées)."
  verify: {check: python_expr, expr: "calc.integral('x*log(x)', 0, 1)"}
