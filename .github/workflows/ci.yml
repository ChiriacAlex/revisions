name: Tests

# Le site n'est plus publié en ligne : il tourne en local dans Docker (PIN + session d'1 h).
# Cette CI vérifie seulement que tout reste juste à chaque push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install pytest pyyaml sympy mpmath
      - name: Compiler et valider le contenu
        run: npm run content
      - name: Typecheck et lint
        run: npm run typecheck && npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Vérification indépendante des réponses
        run: python -m pytest verify -q
      - name: Build de production
        run: npm run build
