# nginx devant le serveur Next : compression, cache des fichiers statiques, en-têtes de sécurité.
upstream revisions_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # Garder le port (localhost:3217) : Next compare l'hôte à l'origine des formulaires (anti-CSRF).
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  # Le serveur s'en sert pour limiter les essais de PIN par client.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Fichiers versionnés de Next (le nom change à chaque build) : cache long.
  location /_next/static/ {
    proxy_pass http://revisions_app;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Python (Pyodide, ~10 Mo) : mis en cache pour ne pas le retélécharger à chaque visite.
  location /vendor/ {
    proxy_pass http://revisions_app;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://revisions_app;
  }
}
